<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to docs.zizmor.sh</title>
    <link rel="canonical" href="https://docs.zizmor.sh/release-notes/">
</head>
<body>
    <h1>Redirecting to docs.zizmor.sh 🌈</h1>
    <p>If you are not redirected automatically, follow the <a id="dest" href="https://docs.zizmor.sh/release-notes/">link</a>.</p>
    <script>
        let fragment = window.location.hash;
        let redirectUrl = `https://docs.zizmor.sh/release-notes/${fragment}`;
        setTimeout(function() {
            window.location=redirectUrl
        }, 1000);
        document.getElementById("dest").setAttribute("href", redirectUrl);
    </script>
</html>
